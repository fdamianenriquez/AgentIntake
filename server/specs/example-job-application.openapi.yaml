openapi: 3.0.3
info:
  title: Job Application Intake API
  description: >-
    A small example API for a job application intake process, used to
    demonstrate AgentIntake's generated multi-step wizard.
  version: 1.0.0
paths:
  /candidates:
    post:
      operationId: createCandidate
      summary: Create candidate
      description: Register a new candidate and their basic details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - yearsOfExperience
                - currentLocation
                - employmentStatus
              properties:
                name:
                  type: string
                  description: The candidate's full name.
                email:
                  type: string
                  pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
                  description: The candidate's email address.
                yearsOfExperience:
                  type: integer
                  minimum: 0
                  description: Total years of professional experience.
                currentLocation:
                  type: string
                  description: The city and country the candidate currently lives in.
                employmentStatus:
                  type: string
                  enum:
                    - employed
                    - unemployed
                  description: Whether the candidate is currently employed.
      responses:
        '201':
          description: Candidate created.
  /work-preferences:
    post:
      operationId: createWorkPreferences
      summary: Create work preferences
      description: Capture what the candidate is looking for in their next role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - desiredRole
                - workArrangement
                - salaryExpectationMin
                - salaryExpectationMax
              properties:
                desiredRole:
                  type: string
                  description: The job title or role the candidate is looking for.
                workArrangement:
                  type: string
                  enum:
                    - remote
                    - hybrid
                    - onsite
                  description: Preferred working arrangement.
                salaryExpectationMin:
                  type: integer
                  minimum: 0
                  description: Minimum acceptable annual salary, in USD.
                salaryExpectationMax:
                  type: integer
                  minimum: 0
                  description: Maximum expected annual salary, in USD.
      responses:
        '201':
          description: Work preferences recorded.
  /availability:
    post:
      operationId: createAvailability
      summary: Create availability
      description: Capture when the candidate can start.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - earliestStartDate
                - noticePeriodDays
              properties:
                earliestStartDate:
                  type: string
                  format: date
                  description: The earliest date the candidate could start.
                noticePeriodDays:
                  type: integer
                  minimum: 0
                  description: How many days' notice the candidate must give their current employer.
                reasonForLeaving:
                  type: string
                  description: >-
                    Why the candidate is leaving their current role. Only
                    relevant if the candidate is currently employed.
      responses:
        '201':
          description: Availability recorded.
